[project]
name = "release-registry"
version = "0.1.0"
description = "Android Google Play release registry"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "google-api-python-client>=2,<3",
    "google-auth>=2,<3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["release_registry"]
