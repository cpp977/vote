# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: dart run dart_define generate --FLAVOR=development && dart analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: dart run dart_define generate --FLAVOR=development && flutter test --dart-define-from-file=dart_define.json

      # Run tests with coverage and enforce 90% threshold (excluding generated files)
      - name: Run tests with coverage
        run: |
          dart run dart_define generate --FLAVOR=development
          flutter test --dart-define-from-file=dart_define.json --coverage

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Filter coverage (exclude generated files)
        run: |
          lcov --remove coverage/lcov.info "lib/gen/*" "lib/l10n/app_localizations_*" --output-file coverage/lcov.filtered.info --ignore-errors empty

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.filtered.info 2>&1 | grep "lines" | sed -E 's/.*lines\.\.\.\.\.\..: ([0-9.]+)%.+/\1/')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 90% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets 90% threshold"
